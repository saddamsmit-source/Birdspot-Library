<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Fotovoorstellen · Aviandra</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/feedback-inbox.css">
</head>
<body>
  <main>
    <header><p>Aviandra · Beheer</p><h1>Fotovoorstellen</h1></header>
    <form id="inboxLogin">
      <label for="ownerKey">Beheerderssleutel</label>
      <input id="ownerKey" type="password" required autocomplete="current-password">
      <button type="submit">Open inbox</button>
    </form>
    <p id="inboxStatus" role="status"></p>
    <section id="inboxItems" aria-label="Ontvangen fotovoorstellen"></section>
    <details>
      <summary>Voorstel uit bestand bekijken</summary>
      <label for="feedbackFile">Kies een Aviandra-fotovoorstel</label>
      <input id="feedbackFile" type="file" accept=".json,application/json">
      <p id="fileStatus" role="status"></p>
      <section id="manualItems" aria-label="Geopende fotovoorstellen"></section>
    </details>
  </main>
  <script type="module" src="src/features/species/feedbackInbox.js"></script>
</body>
</html>
