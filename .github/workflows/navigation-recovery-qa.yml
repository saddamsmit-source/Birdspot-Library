name: Birdspot Navigation Recovery QA
on:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "styles/**"
      - "tests/test_navigation_recovery.py"
      - ".github/workflows/navigation-recovery-qa.yml"
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_navigation_recovery.py
