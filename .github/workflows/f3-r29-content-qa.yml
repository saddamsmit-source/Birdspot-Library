name: Birdspot F3-R29 content and browser QA
on:
  pull_request:
    branches:
      - qa/birdspot-f3-r28-wulp-grutto-tureluur-20261121-gpt6
  workflow_dispatch:
concurrency:
  group: birdspot-f3-r29-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  content-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: R29 three species source, media and comparison contract
        run: |
          node tests/test_lookalike_r29.mjs
          node tests/test_f3_140_unified_rebaseline.mjs
      - name: Prior R28 to R24 evidence remains unchanged
        run: |
          node tests/test_lookalike_r28.mjs
          node tests/test_lookalike_r27.mjs
          node tests/test_lookalike_r26.mjs
          node tests/test_lookalike_r25.mjs
          node tests/test_lookalike_r24.mjs
          node tests/test_kennisbaseline.mjs
          node tests/test_audio_evidence_ceiling.mjs
      - name: Generated species knowledge equals canonical source
        run: python3 -I tools/kennisbaseline/build_knowledge.py --check
  chromium-r29:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Python requirements
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Mobile female comparisons, zoom/back, yearling and audio
        run: python -u tests/test_lookalike_r29_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: birdspot-f3-r29-browser
          path: tests/screenshots/lookalike_r29/*.png
