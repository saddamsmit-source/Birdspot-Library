name: Birdspot UX-02 waarnemingen QA
on:
  pull_request:
    paths: ['.github/workflows/ux02-waarnemingen-qa.yml', 'src/**', 'styles/**', 'sw.js', 'index.html', 'tests/test_ux02*', 'tests/ux02_fixtures.py']
permissions:
  contents: read
jobs:
  ux02:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: UX-02 zoek- en filterlogica (unit)
        run: node tests/test_ux02_query.mjs
      - name: UX-02A zoeken en filteren (Z1–Z11)
        run: |
          set -o pipefail
          python tests/test_ux02a_zoeken.py 2>&1 | tee ux02a.log
      - name: Regressie globale zoekfunctie en waarnemingenlijst
        run: |
          set -o pipefail
          python tests/test_app_search.py 2>&1 | tee ux02-reg-search.log
          python tests/test_sighting_merlin_pins.py 2>&1 | tee ux02-reg-pins.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ux02-evidence, path: 'ux02*.log'}
