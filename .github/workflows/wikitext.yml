name: Wikitekst bronpagina's (eenmalig)
on:
  push:
    branches: [chore/source-audit]
    paths: ["audit/wikitext_titles.json"]
permissions:
  contents: write
jobs:
  wt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python audit/wikitext.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add audit/wikitext && git commit -m "wikitekst" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
