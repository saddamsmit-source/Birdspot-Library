name: Birdspot M13 Small Plovers Independent Photo QA
on:
  pull_request:
    paths:
      - 'tests/test_m13_small_plovers_roles.py'
      - '.github/workflows/m13-small-plovers-qa.yml'
      - 'src/features/species/**'
      - 'assets/species/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plovers:
    name: Registered sources, local WebPs, 360/390px roles, flight and similar species
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: M13 source data, unique local images, and real mobile browser role checks
        shell: bash
        run: |
          set -o pipefail
          python tests/test_m13_small_plovers_roles.py 2>&1 | tee m13-small-plovers.log
      - name: Preserve synthetic-only QA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdspot-m13-small-plovers-log
          path: m13-small-plovers.log
          if-no-files-found: warn
