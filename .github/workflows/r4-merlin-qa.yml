name: Birdspot ronde 4 — Merlin-dubbelcheck in Geluid herkennen
on:
  push:
    branches: ['feat/birdspot-r4-*', 'fix/birdspot-r4-*']
    paths: ['.github/workflows/r4-merlin-qa.yml', 'src/**', 'sw.js', 'index.html', 'styles/**', 'tests/test_r4_*', 'tests/test_r3_*', 'tests/test_quick_add_merlin.py', 'tests/test_owner_sound_choices.py']
  pull_request:
    paths: ['.github/workflows/r4-merlin-qa.yml', 'src/**', 'sw.js', 'index.html', 'styles/**', 'tests/test_r4_*', 'tests/test_r3_*', 'tests/test_quick_add_merlin.py', 'tests/test_owner_sound_choices.py']
permissions:
  contents: read
jobs:
  r4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Ronde 4 — Merlin-dubbelcheck M1–M9 (gesimuleerde handoff via Web Share-vervanging)
        run: |
          set -o pipefail
          git log -1 --format='Uitgecheckt: %H' | tee r4-merlin.log
          python -u tests/test_r4_merlin.py 2>&1 | tee -a r4-merlin.log
      - name: Expliciete geluidsopslag en ZIP v3 (S01–S04)
        run: |
          set -o pipefail
          python -u tests/test_owner_sound_choices.py 2>&1 | tee owner-sound-choices.log
      - name: Regressies geluid, BirdNET-route, Merlin-velden, pins, opslag, ZIP en R08
        run: |
          set -o pipefail
          for t in test_quick_add_merlin.py test_sighting_merlin_pins.py test_r05_gps_race.py test_pilot_offline_new_sighting.py \
                   test_profile_backup.py test_release_backup_roundtrip.py test_pilot_cross_profile_zip.py \
                   test_r3_audio.py test_r3_vervolg.py test_r3_restpunten.py test_r3_leesfout.py; do
            echo "== $t"; python -u "tests/$t"
          done 2>&1 | tee r4-regressies.log
      - run: node tests/test_audio_140_contract.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-merlin-logs
          path: |
            r4-merlin.log
            r4-regressies.log
            owner-sound-choices.log
