name: Birdspot F3-R36 sources and browser regression
on:
  pull_request:
    branches:
      - qa/birdspot-f3-r35-kluut-zilverplevier-goudplevier-20261121-codex
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: birdspot-f3-r36-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  r36-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: F3 register and R36 media and comparison inventories
        run: |
          node tests/test_f3_140_unified_rebaseline.mjs
          node tests/test_lookalike_r36.mjs
          node tests/test_audio_140_contract.mjs
          node tests/test_guide_photo_verification.mjs
          node tests/test_guide_poses.mjs
          node tests/test_lookalike_r35.mjs
  r36-chromium-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chromium
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Plevier photo roles, comparison pages and previous offline media
        run: |
          python -u tests/test_m12_plover_source_roles.py
          python -u tests/test_m13_small_plovers_roles.py
          python -u tests/test_lookalike_r35_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: birdspot-r36-browser-check
          path: |
            tests/screenshots/lookalike_r35/*.png
            tests/screenshots/m12/*.png
            tests/screenshots/m13/*.png
          if-no-files-found: ignore
