name: Birdspot Signature Phase 4 QA
on:
  pull_request:
    paths:
      - "src/**"
      - "styles/**"
      - "index.html"
      - "sw.js"
      - "tests/test_signature_phase4.py"
      - ".github/workflows/signature-phase4-qa.yml"
jobs:
  film-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Real client-side video export test
        run: python tests/test_signature_phase4.py
      - name: Upload Film Studio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signature-phase4-screenshots
          path: tests/screenshots/phase4_*.png
          if-no-files-found: ignore
