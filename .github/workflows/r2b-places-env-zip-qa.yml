name: Birdspot ronde 2B — plekken, omgevingsfoto's, ZIP
on:
  push:
    branches: ['feat/birdspot-r2b-*']
    paths: ['.github/workflows/r2b-places-env-zip-qa.yml', 'src/**', 'sw.js', 'index.html', 'styles/**', 'tests/test_r2b_*', 'tests/test_map_k4.py', 'tests/fixtures/backup_pre_r2b_*.zip']
  pull_request:
    paths: ['.github/workflows/r2b-places-env-zip-qa.yml', 'src/**', 'sw.js', 'index.html', 'styles/**', 'tests/test_r2b_*', 'tests/test_map_k4.py', 'tests/fixtures/backup_pre_r2b_*.zip']
permissions:
  contents: read
jobs:
  r2b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Node-unit plekconsolidatie (0/1/2 kandidaten, 249/251 m, onnauwkeurige GPS)
        run: node tests/test_r2b_places.mjs
      - name: Chromium ronde 2B (C1–C9, E1–E9, R1 + mutatiebewijs, Z1–Z6)
        run: |
          set -o pipefail
          python tests/test_r2b_places_env_zip.py 2>&1 | tee r2b.log
      - name: Bestaande suites (plekken, GPS-race, back-up, offline)
        if: always()
        run: |
          set -o pipefail
          for t in test_map_k4.py test_r05_gps_race.py test_profile_backup.py test_release_backup_roundtrip.py test_pilot_cross_profile_zip.py test_sighting_merlin_pins.py test_pilot_offline_new_sighting.py test_profile_k7.py; do
            echo "::group::$t"
            (cd tests && python "$t") 2>&1 | tee -a regress.log
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2b-evidence
          path: |
            r2b.log
            regress.log
            tests/screenshots/r2b/
