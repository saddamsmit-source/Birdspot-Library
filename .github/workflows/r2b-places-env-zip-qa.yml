name: Birdspot ronde 2B — plekken, omgevingsfoto's, ZIP
on:
  push:
    branches: ['feat/birdspot-r2b-*', 'fix/birdspot-r2b-*']
    paths: ['.github/workflows/r2b-places-env-zip-qa.yml', 'src/**', 'sw.js', 'index.html', 'styles/**', 'tests/test_r2b_*', 'tests/test_map_k4.py', 'tests/fixtures/backup_pre_r2b_*.zip']
  pull_request:
    paths: ['.github/workflows/r2b-places-env-zip-qa.yml', 'src/**', 'sw.js', 'index.html', 'styles/**', 'tests/test_r2b_*', 'tests/test_map_k4.py', 'tests/fixtures/backup_pre_r2b_*.zip']
permissions:
  contents: read
jobs:
  r2b:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Node-unit plekconsolidatie (0/1/2 kandidaten, 249/251 m, onnauwkeurige GPS)
        run: node tests/test_r2b_places.mjs
      - name: Chromium ronde 2B (C1–C9, E1–E9, R1 + mutatiebewijs, Z1–Z6)
        run: |
          set -o pipefail
          python tests/test_r2b_places_env_zip.py 2>&1 | tee r2b.log
      - name: Herstel 2B (QA P1–P4) op deze commit
        run: |
          set -o pipefail
          git log -1 --format='Uitgecheckt: %H' | tee qa-herstel.log
          python tests/test_r2b_qa_herstel.py 2>&1 | tee -a qa-herstel.log
      - name: Zelfde QA-tests op c2b63a0 moeten de gemelde fouten raken
        run: |
          git fetch --depth=1 origin c2b63a003839327a7f2bde0a3af0a7888553b1be
          git worktree add /tmp/wt-c2b63a0 c2b63a003839327a7f2bde0a3af0a7888553b1be
          set +e
          BIRDSPOT_APP_ROOT=/tmp/wt-c2b63a0 python tests/test_r2b_qa_herstel.py > qa-oud.log 2>&1
          rc=$?
          set -e
          cat qa-oud.log
          test "$rc" -ne 0
          for code in H1 H3 H4 H5 H6 H7; do grep -q "^$code .* FAIL" qa-oud.log || { echo "$code faalde NIET op c2b63a0"; exit 1; }; done
          echo "BEWEZEN: H1 H3 H4 H5 H6 H7 falen op c2b63a0"
      - name: Herstel P1-rest (zonder Web Locks, ZIP-medialijst) op deze commit
        run: |
          set -o pipefail
          git log -1 --format='Uitgecheckt: %H' | tee p1-rest.log
          python tests/test_r2b_p1_rest.py 2>&1 | tee -a p1-rest.log
      - name: Zelfde P1-rest-tests op d92d803 moeten de gemelde fouten raken
        run: |
          git fetch --depth=1 origin d92d80393c59c4a6bdda9f4c653b527bbb9850f1
          git worktree add /tmp/wt-d92d803 d92d80393c59c4a6bdda9f4c653b527bbb9850f1
          set +e
          BIRDSPOT_APP_ROOT=/tmp/wt-d92d803 python tests/test_r2b_p1_rest.py > p1-rest-oud.log 2>&1
          rc=$?
          set -e
          cat p1-rest-oud.log
          test "$rc" -ne 0
          for code in L1 L3 K1 K2; do grep -q "^$code .* FAIL" p1-rest-oud.log || { echo "$code faalde NIET op d92d803"; exit 1; }; done
          echo "BEWEZEN: L1 L3 K1 K2 falen op d92d803"
      - name: Slot P1 (twee tabbladen, vertraagde/ontbrekende berichten, oude localStorage) op deze commit
        run: |
          set -o pipefail
          git log -1 --format='Uitgecheckt: %H' | tee p1-slot.log
          python tests/test_r2b_p1_slot.py 2>&1 | tee -a p1-slot.log
      - name: Zelfde slot-tests op 4e1931d moeten de gemelde fouten raken
        run: |
          git fetch --depth=1 origin 4e1931d1b2d80aa21d425d1adb35ca9dfd33c92d
          git worktree add /tmp/wt-4e1931d 4e1931d1b2d80aa21d425d1adb35ca9dfd33c92d
          set +e
          BIRDSPOT_APP_ROOT=/tmp/wt-4e1931d python tests/test_r2b_p1_slot.py > p1-slot-oud.log 2>&1
          rc=$?
          set -e
          cat p1-slot-oud.log
          test "$rc" -ne 0
          for code in S1 S3 S5; do grep -q "^$code .* FAIL" p1-slot-oud.log || { echo "$code faalde NIET op 4e1931d"; exit 1; }; done
          echo "BEWEZEN: S1 S3 S5 falen op 4e1931d"
      - name: Grafsteen-levenscyclus (twee tabbladen, oude plekstand) op deze commit
        run: |
          set -o pipefail
          git log -1 --format='Uitgecheckt: %H' | tee grafsteen.log
          python tests/test_r2b_grafsteen.py 2>&1 | tee -a grafsteen.log
      - name: Zelfde grafsteen-tests op 8400e24 moeten de gemelde fouten raken
        run: |
          git fetch --depth=1 origin 8400e24fa3665e5d0ecb5ac4bf5326e808818e3d
          git worktree add /tmp/wt-8400e24 8400e24fa3665e5d0ecb5ac4bf5326e808818e3d
          set +e
          BIRDSPOT_APP_ROOT=/tmp/wt-8400e24 python tests/test_r2b_grafsteen.py > grafsteen-oud.log 2>&1
          rc=$?
          set -e
          cat grafsteen-oud.log
          test "$rc" -ne 0
          for code in G1 G1b G2 G3; do grep -q "^$code .* FAIL" grafsteen-oud.log || { echo "$code faalde NIET op 8400e24"; exit 1; }; done
          echo "BEWEZEN: G1 G1b G2 G3 falen op 8400e24"
      - name: Import met oude tabbladstand op deze commit
        run: |
          set -o pipefail
          git log -1 --format='Uitgecheckt: %H' | tee import-tabstand.log
          python tests/test_r2b_import_tabstand.py 2>&1 | tee -a import-tabstand.log
      - name: Zelfde tabstand-tests op 20019e1 moeten Q verliezen
        run: |
          git fetch --depth=1 origin 20019e1c5704b8cf34dfb9ccacdcaa22875a153b
          git worktree add /tmp/wt-20019e1 20019e1c5704b8cf34dfb9ccacdcaa22875a153b
          set +e
          BIRDSPOT_APP_ROOT=/tmp/wt-20019e1 python tests/test_r2b_import_tabstand.py > import-tabstand-oud.log 2>&1
          rc=$?
          set -e
          cat import-tabstand-oud.log
          test "$rc" -ne 0
          for code in T1 T2 T3; do grep -q "^$code .* FAIL" import-tabstand-oud.log || { echo "$code faalde NIET op 20019e1"; exit 1; }; done
          echo "BEWEZEN: T1 T2 T3 falen op 20019e1"
      - name: Plekkenopslag IndexedDB leidend (I1–I5, M1–M5) op deze commit
        run: |
          set -o pipefail
          git fetch --depth=1 origin 03bf663c2a315db03307b135e829e8fb6d470975
          git worktree add /tmp/wt-03bf663 03bf663c2a315db03307b135e829e8fb6d470975
          git log -1 --format='Uitgecheckt: %H' | tee plekken-idb.log
          BIRDSPOT_OLD_ROOT=/tmp/wt-03bf663 python -u tests/test_r2b_plekken_idb.py 2>&1 | tee -a plekken-idb.log
      - name: Zelfde plekkentests op 03bf663 moeten Q verliezen
        run: |
          set +e
          BIRDSPOT_APP_ROOT=/tmp/wt-03bf663 python -u tests/test_r2b_plekken_idb.py > plekken-idb-oud.log 2>&1
          rc=$?
          set -e
          cat plekken-idb-oud.log
          test "$rc" -ne 0
          for code in I1 I2 I3 I4; do grep -q "^$code .* FAIL" plekken-idb-oud.log || { echo "$code faalde NIET op 03bf663"; exit 1; }; done
          echo "BEWEZEN: I1 I2 I3 I4 verliezen Q op 03bf663"
      - name: Crashherstel import/Terugzetten + eenmalige grafstenen (A1–A3, B1–B3, G4–G7) op deze commit
        run: |
          set -o pipefail
          git log -1 --format='Uitgecheckt: %H' | tee crashherstel.log
          BIRDSPOT_OLD_ROOT=/tmp/wt-03bf663 python -u tests/test_r2b_crashherstel.py 2>&1 | tee -a crashherstel.log
      - name: Zelfde crashtests op 66673393 moeten de gemelde fouten raken
        run: |
          git fetch --depth=1 origin 66673393e232a6352a3aa08cdea74317ba786989
          git worktree add /tmp/wt-6667339 66673393e232a6352a3aa08cdea74317ba786989
          set +e
          BIRDSPOT_APP_ROOT=/tmp/wt-6667339 BIRDSPOT_OLD_ROOT=/tmp/wt-03bf663 python -u tests/test_r2b_crashherstel.py > crashherstel-oud.log 2>&1
          rc=$?
          set -e
          cat crashherstel-oud.log
          test "$rc" -ne 0
          for code in A1 B1 G4 G5; do grep -q "^$code .* FAIL" crashherstel-oud.log || { echo "$code faalde NIET op 66673393"; exit 1; }; done
          echo "BEWEZEN: A1 B1 G4 G5 falen op 66673393"
      - name: Herstelslot andere tabbladen + onzekere plekken (C1–C4, D1–D3) op deze commit
        run: |
          set -o pipefail
          git log -1 --format='Uitgecheckt: %H' | tee herstelslot.log
          BIRDSPOT_OLD_ROOT=/tmp/wt-03bf663 BIRDSPOT_V2_ROOT=/tmp/wt-6667339 python -u tests/test_r2b_herstelslot.py 2>&1 | tee -a herstelslot.log
      - name: Zelfde herstelslottests op ac5bb10 moeten de gemelde fouten raken
        run: |
          git fetch --depth=1 origin ac5bb1046eda550768fd7781ae6b7cbc9e894b90
          git worktree add /tmp/wt-ac5bb10 ac5bb1046eda550768fd7781ae6b7cbc9e894b90
          set +e
          BIRDSPOT_APP_ROOT=/tmp/wt-ac5bb10 BIRDSPOT_OLD_ROOT=/tmp/wt-03bf663 BIRDSPOT_V2_ROOT=/tmp/wt-6667339 python -u tests/test_r2b_herstelslot.py > herstelslot-oud.log 2>&1
          rc=$?
          set -e
          cat herstelslot-oud.log
          test "$rc" -ne 0
          for code in C1 C2 D1 D2; do grep -q "^$code .* FAIL" herstelslot-oud.log || { echo "$code faalde NIET op ac5bb10"; exit 1; }; done
          echo "BEWEZEN: C1 C2 D1 D2 falen op ac5bb10"
      - name: Bestaande suites (plekken, GPS-race, back-up, offline)
        if: always()
        run: |
          set -o pipefail
          git fetch --depth=1 origin 5bf67043e830e977749f0ee593cf9f41f0e2822b   # basis voor test_release_upgrade.py (git archive 5bf6704)
          for t in test_map_k4.py test_map_k5.py test_map_k6.py test_r05_gps_race.py test_profile_backup.py test_release_backup_roundtrip.py test_pilot_cross_profile_zip.py test_sighting_merlin_pins.py test_pilot_offline_new_sighting.py test_profile_k7.py test_signature.py test_release_upgrade.py test_quick_add_merlin.py; do
            echo "::group::$t"
            (cd tests && python "$t") 2>&1 | tee -a regress.log
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2b-evidence
          path: |
            r2b.log
            regress.log
            qa-herstel.log
            qa-oud.log
            p1-rest.log
            p1-rest-oud.log
            p1-slot.log
            p1-slot-oud.log
            grafsteen.log
            grafsteen-oud.log
            import-tabstand.log
            import-tabstand-oud.log
            plekken-idb.log
            plekken-idb-oud.log
            crashherstel.log
            crashherstel-oud.log
            herstelslot.log
            herstelslot-oud.log
            tests/screenshots/r2b/
