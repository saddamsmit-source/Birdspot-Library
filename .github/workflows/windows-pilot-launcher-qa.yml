name: Birdspot Windows Pilot Launcher (no device)

on:
  pull_request:
    paths:
      - 'tools/pilot/Start-BirdspotAndroidPilot.ps1'
      - 'docs/pilot/ANDROID_WINDOWS_S1_STARTKAART_2026-11-13_DRAFT.md'
      - '.github/workflows/windows-pilot-launcher-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-launcher:
    name: Parse PowerShell and run read-only self-check; Android NOT TESTED
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax without downloading or opening ports
        shell: pwsh
        run: |
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'tools/pilot/Start-BirdspotAndroidPilot.ps1',
            [ref]$tokens, [ref]$errorsFound
          ) | Out-Null
          if ($errorsFound.Count -ne 0) {
            $errorsFound | Format-List | Out-String | Write-Output
            throw 'PowerShell syntax invalid'
          }
      - name: "Pinned candidate self-check: no clone, USB, network or publish"
        shell: pwsh
        run: |
          ./tools/pilot/Start-BirdspotAndroidPilot.ps1 -SelfCheck
      - name: Confirm test script never calls deployment or destructive git operations
        shell: python
        run: |
          from pathlib import Path
          text = Path('tools/pilot/Start-BirdspotAndroidPilot.ps1').read_text(encoding='utf-8')
          assert "83c117447126b705cae1899f71e66d070a6084b9" in text
          assert "qa/birdspot-release-candidate-1.27.7-20261113" in text
          assert "http.server" in text and "127.0.0.1" in text
          assert "git clone" in text and "git -C $checkout archive" in text
          assert "git push" not in text and "git reset --hard" not in text
          print('PASS: pinned offline-only launcher contract. Physical Android NOT TESTED.')

  windows-preparation:
    name: Actual Windows pinned-source staging (no server, no Android)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows PowerShell 5.1 prepare-only path on pinned source
        shell: powershell
        run: |
          .\tools\pilot\Start-BirdspotAndroidPilot.ps1 -PrepareOnly
      - name: Check staged snapshot has 1.27.7 and no Git metadata
        shell: powershell
        run: |
          $root = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Birdspot-Pilot'
          $source = Join-Path $root 'source-83c117447126'
          if (!(Test-Path (Join-Path $source '.git'))) { throw 'Verified checkout is missing.' }
          $head = (& git -C $source rev-parse HEAD).Trim()
          if ($head -ne '83c117447126b705cae1899f71e66d070a6084b9') { throw 'Wrong source commit.' }
          $sites = @(Get-ChildItem -LiteralPath $root -Directory | Where-Object { $_.Name -like 'site-*' })
          if ($sites.Count -ne 1) { throw 'Expected exactly one clean staging snapshot.' }
          $site = $sites[0].FullName
          if (Test-Path (Join-Path $site '.git')) { throw 'Sensitive Git metadata exposed by server root.' }
          if (!(Test-Path (Join-Path $site 'index.html'))) { throw 'App shell missing.' }
          $sw = Get-Content (Join-Path $site 'sw.js') -Raw
          if (!$sw.Contains("const APP_VERSION = '1.27.7';")) { throw 'Wrong serviceworker version.' }
          Write-Output 'PASS exact pinned Windows source and separate clean 1.27.7 snapshot; server/device NOT STARTED.'
