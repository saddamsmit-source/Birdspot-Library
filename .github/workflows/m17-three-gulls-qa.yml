name: Birdspot M17 Three Gulls F1 QA
on:
  pull_request:
    paths:
      - 'tests/test_m17_three_gulls_first_pass.py'
      - '.github/workflows/m17-three-gulls-qa.yml'
      - 'docs/fotokwaliteit/F1_VOORTGANG_TOT_140.json'
      - 'docs/fotokwaliteit/M17_DRIE_MEEUWEN_2026-11-13_DRAFT.md'
      - 'assets/species/**'
      - 'src/features/species/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-gulls-first-pass:
    name: F1 117/140, eight WebPs, generator and 360/390px browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify source-to-generator equality without weakening contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/species/build.py
          git diff --exit-code -- src/features/species/guidePhotos.js src/features/species/guideMedia.js
      - name: Validate eight real local WebPs, credits, age note, roles and browser
        shell: bash
        run: |
          set -o pipefail
          python tests/test_m17_three_gulls_first_pass.py 2>&1 | tee m17-three-gulls.log
      - name: Keep synthetic QA log (no user photos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdspot-m17-f1-log
          path: m17-three-gulls.log
          if-no-files-found: warn
