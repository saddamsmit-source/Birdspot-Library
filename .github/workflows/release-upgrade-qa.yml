name: Birdspot Release Upgrade Gate

on:
  push:
    branches:
      - qa/release-1.27-upgrade-gates-20261111
    paths:
      - .github/workflows/release-upgrade-qa.yml
      - tests/test_release_upgrade.py
      - tests/test_release_backup_roundtrip.py
      - sw.js
      - docs/release/**
  pull_request:
    branches:
      - main
      - release/birdspot-1.27.0
      - preview/birdspot-review
    paths:
      - .github/workflows/release-upgrade-qa.yml
      - tests/test_release_upgrade.py
      - tests/test_release_backup_roundtrip.py
      - sw.js
      - docs/release/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    name: Upgrade from ${{ matrix.baseline.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        baseline:
          - name: 1.14.0-main
            ref: 5bf67043e830e977749f0ee593cf9f41f0e2822b
          - name: 1.27.2-pages
            ref: 8ba6eaf34d1ef6c0c6dadc133aa7cc65a54ec6c2
          - name: 1.27.1-pages
            ref: 19172183bea778ec4b92369bb9e847d6755fb0b3
          - name: 1.27.0-pages
            ref: 41c7fed620d9abc95aa86ba8d8e9f779d87f95a8
          - name: previous-pages-review
            ref: 659cbb8bc3c4c54a7d6ae7a5fe499319de309d88
    steps:
      - name: Check out full history for real upgrade, not a mocked baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm exact baseline commit exists
        env:
          BASE_SHA: ${{ matrix.baseline.ref }}
        run: git cat-file -e "$BASE_SHA^{commit}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: RU-01..RU-07 actual service-worker, localStorage and IndexedDB upgrade
        env:
          BASE_SHA: ${{ matrix.baseline.ref }}
        shell: bash
        run: |
          set -o pipefail
          python tests/test_release_upgrade.py --base "$BASE_SHA" 2>&1 | tee "upgrade-${{ matrix.baseline.name }}.log"
      - name: BR-01..BR-07 real ZIP backup, import, cancel, corruption and safety rollback
        if: matrix.baseline.name == '1.14.0-main'
        shell: bash
        run: |
          set -o pipefail
          python tests/test_profile_backup.py 2>&1 | tee profile-backup.log
          python tests/test_release_backup_roundtrip.py 2>&1 | tee backup-roundtrip.log
      - name: Preserve reproducible upgrade evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdspot-release-upgrade-${{ matrix.baseline.name }}
          path: |
            upgrade-*.log
            profile-backup.log
            backup-roundtrip.log
          if-no-files-found: warn
