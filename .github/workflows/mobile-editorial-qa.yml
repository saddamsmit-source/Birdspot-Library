name: Birdspot Mobile Field & Wildlife Editorial QA
on:
  pull_request:
    paths:
      - "src/features/home/**"
      - "src/features/species/**"
      - "src/features/sightings/addSheet.js"
      - "styles/mobile-field-editorial.css"
      - "index.html"
      - "sw.js"
      - "tests/test_mobile_editorial.py"
      - ".github/workflows/mobile-editorial-qa.yml"
jobs:
  mobile-field-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate mobile form, species observation shortcuts, editorial rotation and motion
        run: python tests/test_mobile_editorial.py
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-editorial-field-screenshots
          path: tests/screenshots/mobile_*.png
          if-no-files-found: ignore
