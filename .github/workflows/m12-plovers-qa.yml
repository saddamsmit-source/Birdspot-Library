name: Birdspot M12 Plevieren Photo Role QA
on:
  pull_request:
    paths:
      - 'tests/test_m12_plover_source_roles.py'
      - '.github/workflows/m12-plovers-qa.yml'
      - 'assets/species/**'
      - 'src/features/species/**'
      - 'docs/fotokwaliteit/M12_PLEVIEREN_2026-11-13_DRAFT.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-plovers:
    name: Three species, real WebPs and Chromium role/flight comparison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: M12 binaries, source metadata, role integrity and browser display
        shell: bash
        run: |
          set -o pipefail
          python tests/test_m12_plover_source_roles.py 2>&1 | tee m12-plovers.log
      - name: Keep reproducible synthetic-only test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdspot-m12-three-plovers-log
          path: m12-plovers.log
          if-no-files-found: warn
