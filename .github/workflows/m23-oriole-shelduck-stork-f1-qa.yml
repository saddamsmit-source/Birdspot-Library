name: Birdspot M23 Oriole Shelduck Stork Photo QA
on:
  pull_request:
    paths:
      - 'tests/test_m23_oriole_shelduck_stork_f1.py'
      - '.github/workflows/m23-oriole-shelduck-stork-f1-qa.yml'
      - 'docs/fotokwaliteit/F1_VOORTGANG_TOT_140.json'
      - 'docs/fotokwaliteit/M23_WIELEWAAL_BERGEEND_OOIEVAAR_2026-11-14_DRAFT.md'
      - 'assets/species/**'
      - 'src/features/species/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m23-first-pass:
    name: F1 135/140, eight unique WebPs, sex/age/flight, six Chromium screens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Source/generated consistency
        shell: bash
        run: |
          set -euo pipefail
          python tools/species/build.py
          git diff --exit-code -- src/features/species/guidePhotos.js src/features/species/guideMedia.js
      - name: Local photos, registered roles, initial ledger, real browser
        shell: bash
        run: |
          set -o pipefail
          python tests/test_m23_oriole_shelduck_stork_f1.py 2>&1 | tee m23-f1.log
      - name: Keep synthetic QA log only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdspot-m23-f1
          path: m23-f1.log
          if-no-files-found: warn
