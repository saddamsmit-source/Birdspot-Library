name: Birdspot FOT-01/FOT-02/WEE-01 QA
on:
  pull_request:
    paths: ['.github/workflows/fot-wee-ux-qa.yml', 'src/**', 'styles/**', 'sw.js', 'index.html', 'tests/test_fot_wee_ux.py', 'tests/test_fot_wee_units.mjs']
permissions:
  contents: read
jobs:
  fot-wee:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Pure functions (compass, wind, location, hero set)
        run: node tests/test_fot_wee_units.mjs
      - name: Browser 320/390/430 — swipe+zoom, photo counts, hero set, weather (A1–A9, B1–B4, C1–C7)
        run: |
          set -o pipefail
          python tests/test_fot_wee_ux.py 2>&1 | tee fot-wee.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: fot-wee-evidence, path: fot-wee.log}
