name: Birdspot Android JPEG Media Preflight

on:
  pull_request:
    paths:
      - 'tests/test_android_media_preflight.py'
      - '.github/workflows/android-media-preflight-qa.yml'
      - 'src/features/sightings/**'
      - 'src/utils/validateMedia.js'
      - 'src/data/db.js'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-jpeg-preflight:
    name: Offline JPEG reject/retry/storage on mobile Chromium (not physical Android)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: CAM-01..06, actual local serviceworker and media storage
        shell: bash
        run: |
          set -o pipefail
          python tests/test_android_media_preflight.py 2>&1 | tee android-jpeg-preflight.log
      - name: Preserve synthetic-only logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdspot-android-jpeg-preflight-log
          path: android-jpeg-preflight.log
          if-no-files-found: warn
