name: Birdspot one-off verified juvenile import
on:
  push:
    branches:
      - 'feat/guide-photo-review-03-juvenile-black-woodpecker'
    paths:
      - '.github/workflows/verified-sp018-juvenile-import.yml'
permissions:
  contents: write
jobs:
  import-reviewed-source:
    if: github.repository == 'saddamsmit-source/Birdspot-Library'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebP conversion dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Import checksum-verified licensed source; strip sensitive EXIF/GPS
        run: python tools/species/import_verified_sp018_juvenile.py
      - name: Rebuild generated guide metadata
        run: python tools/species/build.py
      - name: Check local file and git-visible metadata
        run: |
          test -s assets/species/plumage/sp018-juv-review.webp
          grep -q "sp018-juv-review.webp" assets/species/field-guide-media.json
          grep -q "sp018-juv-review.webp" src/features/species/guideMedia.js
      - name: Commit generated outputs to this one-off feature branch only
        run: |
          git config user.name "Birdspot Photo Import Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/species/plumage/sp018-juv-review.webp assets/species/field-guide-media.json src/features/species/guideMedia.js
          git diff --cached --quiet && exit 1
          git commit -m "feat: import verified juvenile Black Woodpecker WebP without metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
