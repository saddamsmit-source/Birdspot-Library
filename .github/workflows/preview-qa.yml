name: Birdspot preview QA (handmatig)
# Vaste previewcontrole voor Claude en ChatGPT (PR #358). Alleen handmatig starten na één bewuste
# Vercel-preview van een reviewcheckpoint. Maakt zelf geen deployment en wijzigt niets op Vercel.
# Vereiste repo-secrets (eigenaar): VERCEL_AUTOMATION_BYPASS_SECRET (Protection Bypass for Automation),
# VERCEL_TOKEN en VERCEL_TEAM_ID (alleen lezen van de deployment). Ontbreken ze: uitkomst BLOCKED.
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Preview-URL (https://<deployment>.vercel.app/)'
        required: true
      expected_sha:
        description: 'Geteste GitHub-SHA (40 tekens)'
        required: true
jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: 1-3 Deployed SHA and READY (Vercel API, read-only)
        id: sha
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          PREVIEW_URL: ${{ inputs.preview_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -o pipefail
          node tools/preview/check_deployment.mjs "$PREVIEW_URL" "$EXPECTED_SHA" | tee deployment-check.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: 4-10 Authorized access, routes, photos, credits, offline, errors (320/390/430)
        id: browser
        continue-on-error: true
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: python tests/preview_qa.py --url "$PREVIEW_URL" --report preview-qa.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-qa-${{ inputs.expected_sha }}
          path: |
            deployment-check.json
            preview-qa.json
      - name: Outcome (PASS only when both layers pass)
        run: |
          echo "deployment: $SHA_OUTCOME · browser: $BROWSER_OUTCOME"
          test "$SHA_OUTCOME" = success && test "$BROWSER_OUTCOME" = success
        env:
          SHA_OUTCOME: ${{ steps.sha.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
