name: Birdspot F3-R27 content QA
on:
  pull_request:
    branches:
      - qa/birdspot-f3-r26-meeuwen-20261121-gpt6
  workflow_dispatch:
concurrency:
  group: birdspot-f3-r27-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  field-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify R27 registered media bytes, role and source boundaries
        run: |
          node tests/test_lookalike_r27.mjs
          node tests/test_f3_140_unified_rebaseline.mjs
      - name: Verify prior R26 R25 R24 evidence remains valid
        run: |
          node tests/test_lookalike_r26.mjs
          node tests/test_lookalike_r25.mjs
          node tests/test_lookalike_r24.mjs
          node tests/test_kennisbaseline.mjs
          node tests/test_audio_evidence_ceiling.mjs
      - name: Verify canonical knowledge generation
        run: python3 -I tools/kennisbaseline/build_knowledge.py --check
