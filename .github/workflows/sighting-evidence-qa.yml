name: Birdspot Observation Evidence & Pins QA

on:
  pull_request:
    paths:
      - "src/**"
      - "styles/**"
      - "index.html"
      - "sw.js"
      - "tests/test_sighting_merlin_pins.py"
      - ".github/workflows/sighting-evidence-qa.yml"
jobs:
  sightings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser requirements
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test manual pins, Merlin evidence, photo/video and ZIP restoration
        run: python tests/test_sighting_merlin_pins.py
      - name: Upload evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sightings-merlin-pins-screenshots
          path: tests/screenshots/sighting_*.png
          if-no-files-found: ignore
