name: Birdspot F3-R21 content QA

on:
  pull_request:
    branches:
      - docs/birdspot-rondes-1-4-20261119
  workflow_dispatch:

concurrency:
  group: birdspot-f3-r21-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Species, evidence boundaries and source consistency
        run: |
          node tests/test_kennisbaseline.mjs
          node tests/test_lookalike_r09.mjs
          node tests/test_lookalike_r21.mjs
          node tests/test_lookalike_r20.mjs
          node tests/test_f3_r21_ijsvogel_juvenile_hold.mjs
          node tests/test_f3_140_unified_rebaseline.mjs
          node tests/test_audio_evidence_ceiling.mjs
          node tests/test_guide_poses.mjs
          python3 -I tools/kennisbaseline/build_knowledge.py --check
          python3 tools/species/build.py
          git diff --exit-code src/features/species/guideMedia.js src/features/species/guidePhotos.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and source comparison dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pip install numpy==2.1.3 pillow==11.0.0
          python -m playwright install --with-deps chromium
      - name: Real mobile comparison and audio UI
        run: |
          python tests/test_orig_check.py
          python tests/test_lookalike_r21_browser.py
          python tests/test_lookalike_r20_browser.py
          python tests/test_audio_status_browser.py
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdspot-f3-r21-browser
          path: tests/screenshots/lookalike_r21/*.png
