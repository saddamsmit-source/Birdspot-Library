name: Birdspot owner UX - veldcheck en opnameknop
on:
  push:
    paths:
      - 'src/features/home/**'
      - 'src/features/sightings/soundSession.js'
      - 'styles/field-experience.css'
      - 'styles/sightings.css'
      - 'tests/test_owner_quickcheck.mjs'
      - '.github/workflows/owner-ux-quickcheck.yml'
  pull_request:
    paths:
      - 'src/features/home/**'
      - 'src/features/sightings/soundSession.js'
      - 'styles/field-experience.css'
      - 'styles/sightings.css'
      - 'tests/test_owner_quickcheck.mjs'
      - '.github/workflows/owner-ux-quickcheck.yml'
jobs:
  quickcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --check src/features/home/view.js && node --check src/features/home/featuredCarousel.js && node --check src/features/sightings/soundSession.js
      - run: node tests/test_owner_quickcheck.mjs
