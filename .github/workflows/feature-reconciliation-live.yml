name: Birdspot feature reconciliation (live URL)
on:
  push:
    branches: [docs/birdspot-feature-reconciliatie-20261117]
    paths: [.github/workflows/feature-reconciliation-live.yml, tests/test_feature_reconciliation.py]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg >/dev/null
          ffmpeg -loglevel error -y -i assets/species/audio/sp045-song.mp3 -ac 1 -ar 48000 /tmp/merel.wav
      - name: Live URL (published 1.27.31)
        env:
          BIRDSPOT_BASE_URL: https://saddamsmit-source.github.io/Birdspot-Library/
          BIRDSPOT_FAKE_AUDIO: /tmp/merel.wav
          BIRDSPOT_RECORD_SECONDS: '40'
        run: python tests/test_feature_reconciliation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-reconciliation-live
          path: tests/screenshots/feature_reconciliation/
