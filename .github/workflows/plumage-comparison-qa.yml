name: Birdspot Plumage Comparison UX QA

on:
  pull_request:
    paths:
      - 'src/features/species/detailSections.js'
      - 'styles/species.css'
      - 'tests/test_plumage_compare_layout.py'
      - 'tests/test_guide_poses.mjs'
      - '.github/workflows/plumage-comparison-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plumage-ux:
    name: Four viewport comparison, photo roles and zoom
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing guide-role, source and duplicate contracts
        run: node tests/test_guide_poses.mjs
      - name: Install existing Chromium test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Visual layout, decoded images and controls at 360/390/430/1280
        shell: bash
        run: |
          set -o pipefail
          python tests/test_plumage_compare_layout.py 2>&1 | tee plumage-comparison.log
      - name: Preserve non-personal screenshot and reproducible test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdspot-plumage-comparison-390
          path: |
            plumage-comparison.log
            tests/screenshots/plumage_compare/*.png
          if-no-files-found: warn
