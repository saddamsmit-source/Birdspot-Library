name: Birdspot F3-R39 photo, audio and comparison regression
on:
  pull_request:
    branches:
      - qa/birdspot-f3-r38-bonte-strandloper-oeverloper-witgat-20261122-gpt6
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: birdspot-f3-r39-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  r39-data-and-source-ceiling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cohort, media and negative source-proof contracts
        run: |
          node tests/test_f3_140_unified_rebaseline.mjs
          node tests/test_lookalike_r39.mjs
          node tests/test_lookalike_r38.mjs
          node tests/test_lookalike_r37.mjs
          node tests/test_lookalike_r36.mjs
          node tests/test_lookalike_r35.mjs
          node tests/test_lookalike_r09.mjs
          node tests/test_audio_140_contract.mjs
          node tests/test_audio_evidence_ceiling.mjs
          node tests/test_guide_poses.mjs
          node tests/test_guide_photo_verification.mjs
          node tests/test_kennisbaseline.mjs
  r39-chromium-and-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: R39 320/360/390 mobile, reciprocal species navigation, media and fresh offline
        run: python -u tests/test_lookalike_r39_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: birdspot-f3-r39-chromium
          path: tests/screenshots/lookalike_r39/*.png
          if-no-files-found: ignore
