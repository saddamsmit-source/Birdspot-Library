name: Birdspot Media Intake (Commons)

# Handmatig gestart. Haalt media alleen op GitHub-runners op (de agentruntime heeft geen
# toegang tot mediahosts). Schrijft uitsluitend naar de gekozen F3-mediabranch, nooit naar
# main of preview. Elke import is vastgepind op SHA-1 en licentie in een manifest in Git.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: discover of import
        required: true
        type: choice
        options: [discover, import]
      manifest:
        description: pad naar het manifest in de repo
        required: true
      out:
        description: uitvoermap voor discover
        required: false
        default: docs/media-intake/2026-11-16

permissions:
  contents: write

concurrency:
  group: media-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Weiger beschermde branches
        run: |
          case "${GITHUB_REF_NAME}" in
            main|preview/*|release/*) echo "Niet toegestaan op ${GITHUB_REF_NAME}"; exit 1;;
            qa/birdspot-f3-*-media-*) ;;
            *) echo "Alleen F3-mediabranches"; exit 1;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Afhankelijkheden
        run: |
          python -m pip install pillow==11.0.0
          ffmpeg -version | head -1
      - name: Intake
        run: |
          if [ "${{ inputs.mode }}" = discover ]; then
            python tools/media/commons_intake.py discover "${{ inputs.manifest }}" --out "${{ inputs.out }}"
          else
            python tools/media/commons_intake.py import "${{ inputs.manifest }}"
          fi
      - name: Commit resultaat naar dezelfde branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets docs/media-intake tools/media src/features/species
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Birdspot media-intake (${{ inputs.mode }}): ${{ inputs.manifest }}

          Gestart door de geclaimde schrijver van deze branch via workflow_dispatch; run ${{ github.run_id }}."
          git push origin HEAD:${GITHUB_REF_NAME}
