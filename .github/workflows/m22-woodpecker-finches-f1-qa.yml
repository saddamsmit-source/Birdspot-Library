name: Birdspot M22 Woodpecker and Two Finches F1 QA
on:
  pull_request:
    paths:
      - 'tests/test_m22_woodpecker_finches_f1.py'
      - '.github/workflows/m22-woodpecker-finches-f1-qa.yml'
      - 'docs/fotokwaliteit/F1_VOORTGANG_TOT_140.json'
      - 'docs/fotokwaliteit/M22_SPECHT_EN_TWEE_VINKEN_2026-11-14_DRAFT.md'
      - 'assets/species/**'
      - 'src/features/species/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-birds-first-pass:
    name: M22 F1 132/140, seven real WebPs, Chromium 360/390px
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Test exact source/generated image metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          python tools/species/build.py
          git diff --exit-code -- src/features/species/guidePhotos.js src/features/species/guideMedia.js
      - name: Test real photo bytes, first-pass ledger and mobile photo roles
        shell: bash
        run: |
          set -o pipefail
          python tests/test_m22_woodpecker_finches_f1.py 2>&1 | tee m22-f1.log
      - name: Retain synthetic QA log without personal records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdspot-m22-f1
          path: m22-f1.log
          if-no-files-found: warn
