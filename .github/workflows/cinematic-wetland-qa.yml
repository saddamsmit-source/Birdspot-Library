name: Birdspot Cinematic Wetland QA
on:
  pull_request:
    paths:
      - "src/features/home/**"
      - "styles/cinematic-wetland.css"
      - "index.html"
      - "sw.js"
      - "tests/test_cinematic_wetland.py"
      - ".github/workflows/cinematic-wetland-qa.yml"
jobs:
  cinematic-backdrop:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test video playback, CSS fallback, contrast and mobile layouts
        run: python tests/test_cinematic_wetland.py
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdspot-cinematic-wetland-screenshots
          path: tests/screenshots/cinematic_wetland_*.png
          if-no-files-found: ignore
