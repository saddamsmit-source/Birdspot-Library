name: Birdspot F3-R43 guide and offline media QA
on:
  pull_request:
    branches:
      - qa/birdspot-f3-r42-zwarte-mees-vliegenvangers-20261122-gpt6
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: birdspot-f3-r43-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  r43-chromium-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: R43 on 320, 360 and 390 px, including a fresh profile and offline
        run: python -u tests/test_lookalike_r43_browser.py
