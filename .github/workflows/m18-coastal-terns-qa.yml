name: Birdspot M18 Coastal Terns and Dunlin First-Pass QA
on:
  pull_request:
    paths:
      - 'tests/test_m18_coastal_terns_f1.py'
      - '.github/workflows/m18-coastal-terns-qa.yml'
      - 'docs/fotokwaliteit/F1_VOORTGANG_TOT_140.json'
      - 'docs/fotokwaliteit/M18_STRANDLOPER_STERNS_2026-11-13_DRAFT.md'
      - 'assets/species/**'
      - 'src/features/species/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-coastal-species:
    name: F1 120/140 + three actual WebPs + six real Chromium screens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Real WebP assets, flight-versus-hero, F1, 360/390px zoom and comparison
        shell: bash
        run: |
          set -o pipefail
          python tests/test_m18_coastal_terns_f1.py 2>&1 | tee m18-coastal-terns.log
      - name: Retain privacy-safe synthetic test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdspot-m18-first-pass-log
          path: m18-coastal-terns.log
          if-no-files-found: warn
