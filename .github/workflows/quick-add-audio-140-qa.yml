name: Birdspot Quick Add and Audio 140 QA
on:
  pull_request:
    paths:
      - 'src/app.js'
      - 'src/features/sightings/quickAdd.js'
      - 'src/features/sightings/sound*.js'
      - 'src/features/sightings/addSheet.js'
      - 'src/data/sightings.js'
      - 'styles/sightings.css'
      - 'sw.js'
      - 'docs/audio/**'
      - 'tests/test_audio_140_contract.mjs'
      - 'tests/test_quick_add_merlin.py'
      - '.github/workflows/quick-add-audio-140-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick-add-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check src/features/sightings/quickAdd.js
      - run: node --check src/features/sightings/soundSession.js
      - run: node tests/test_audio_140_contract.mjs
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Mobile recording, species selection and private group pins
        run: python tests/test_quick_add_merlin.py
