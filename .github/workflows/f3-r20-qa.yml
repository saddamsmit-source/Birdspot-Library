name: Birdspot F3-R20 QA

on:
  push:
    branches:
      - qa/birdspot-f3-r20-media-witte-gele-kwikstaart-veldleeuwerik-20261117
  pull_request:
    branches:
      - qa/birdspot-f3-r19-media-boomklever-boomkruiper-taigaboomkruiper-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookalikes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check strict source-backed lookalike pairs and hidden missing photo slots
        run: |
          node --check src/features/species/guideComparisons.js
          node tests/test_lookalike_r09.mjs
          node tests/test_lookalike_r10.mjs
          node tests/test_lookalike_r11.mjs
          node tests/test_lookalike_r12.mjs
          node tests/test_lookalike_r13.mjs
          node tests/test_audio_evidence_ceiling.mjs
          node tests/test_lookalike_r14.mjs
          node tests/test_lookalike_r15.mjs
          node tests/test_lookalike_r16.mjs
          node tests/test_lookalike_r17.mjs
          node tests/test_f3_plumage_rule.mjs
          node tests/test_lookalike_r18.mjs
          node tests/test_lookalike_r19.mjs
          node tests/test_lookalike_r20.mjs
          node tests/test_f3_140_unified_rebaseline.mjs
          python3 -I tools/kennisbaseline/build_knowledge.py --check
          node tests/test_guide_poses.mjs
          node tests/test_media_intake_r10.mjs
          node tests/test_vluchtcontrole.mjs
          node tests/test_guide_photo_verification.mjs
          python3 tests/test_media_intake_policy.py
          node tests/test_soortaudit.mjs
          node tests/test_fotovolgorde_2026-11-10.mjs
          node tests/test_audio_140_contract.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium for actual user interface comparisons
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Generated species data stays equal to canonical sources
        run: |
          python tools/species/apply_status.py
          python tools/species/apply_plumage.py
          git diff --exit-code src/data/species.js
          python tests/test_species_data.py
          python tests/test_species_detail.py
          python tests/test_kennisbaseline_browser.py
          python -m pip install numpy==2.1.3 pillow==11.0.0
          python tests/test_audio_check.py
          python tests/test_orig_check.py
          python tests/test_media_path_boundaries.py
          python tests/test_m22_woodpecker_finches_f1.py
          python tests/test_m20_three_warblers_first_pass.py
      - name: Media generator stays idempotent (no hand edits in generated files)
        run: |
          python tools/species/build.py
          git diff --exit-code src/features/species/guideMedia.js src/features/species/guidePhotos.js
          python3 -I tools/fotokwaliteit/build_soortaudit_tracker.py
          git diff --exit-code docs/fotokwaliteit/SOORTAUDIT_TRACKER.md
      - name: Real paired images, zoom and lookalike text on 320/360/390px
        run: |
          python tests/test_lookalike_r09_browser.py
          python tests/test_lookalike_r10_browser.py
          python tests/test_lookalike_r11_browser.py
          python tests/test_lookalike_r12_browser.py
          python tests/test_lookalike_r13_browser.py
          python tests/test_lookalike_r14_browser.py
          python tests/test_lookalike_r15_browser.py
          python tests/test_lookalike_r16_browser.py
          python tests/test_lookalike_r17_browser.py
          python tests/test_lookalike_r18_browser.py
          python tests/test_lookalike_r19_browser.py
          python tests/test_lookalike_r20_browser.py
          python tests/test_audio_status_browser.py
          python tests/test_mobile_owner_review.py
          python tests/test_soortaudit_browser.py
          git checkout -- docs/fotokwaliteit/soortaudit/browser.json
      - name: Preserve evidence images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdspot-f3-r20-browser
          path: |
            tests/screenshots/lookalike_r09/*.png
            tests/screenshots/lookalike_r10/*.png
            tests/screenshots/lookalike_r11/*.png
            tests/screenshots/lookalike_r12/*.png
            tests/screenshots/lookalike_r14/*.png
            tests/screenshots/lookalike_r15/*.png
            tests/screenshots/lookalike_r16/*.png
            tests/screenshots/lookalike_r17/*.png
            tests/screenshots/lookalike_r18/*.png
            tests/screenshots/lookalike_r19/*.png
            tests/screenshots/lookalike_r20/*.png
          if-no-files-found: warn
