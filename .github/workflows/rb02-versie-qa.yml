name: Birdspot serviceworker-upgrade QA
on:
  pull_request:
    paths: ['.github/workflows/rb02-versie-qa.yml', 'sw.js', 'src/**', 'styles/**', 'index.html', 'tests/test_rb01*', 'tests/test_as01*', 'tests/ux02_fixtures.py']
permissions:
  contents: read
jobs:
  rb02:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Upgrade 1.27.34 naar kandidaat op dezelfde origin plus schone installatie (U1–U9)
        run: |
          set -o pipefail
          python tests/test_rb01_upgrade.py --base 36444874c744c16bc007da919c5c4b61c6292d63 2>&1 | tee rb02_upgrade.log
      - name: AS-01 geluidsopnamemenu veilig afsluitbaar op de kandidaat (T1–T8)
        run: |
          set -o pipefail
          python tests/test_as01_audiosluiten.py 2>&1 | tee rb02_as01.log
