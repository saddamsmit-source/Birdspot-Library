name: Birdspot UX-03 interface QA
on:
  pull_request:
    paths: ['.github/workflows/ux03-interface-qa.yml', 'src/**', 'styles/**', 'sw.js', 'index.html', 'tests/test_ux03*', 'tests/ux02_fixtures.py']
permissions:
  contents: read
jobs:
  ux03:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: UX-03A navigatie en iconen (N1–N11)
        run: |
          set -o pipefail
          python tests/test_ux03a_navigatie.py 2>&1 | tee ux03a.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ux03-evidence, path: 'ux03*.log'}
