name: Importeer gekozen juveniele foto's (eenmalig)
on:
  push:
    branches: [chore/source-audit]
    paths: ["audit/juv_picks.json", "audit/import_juv_picks.py", ".github/workflows/juv-import.yml"]
permissions:
  contents: write
concurrency: { group: source-audit-branch, cancel-in-progress: false }
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow==10.4.0
      - run: python audit/import_juv_picks.py
      - name: Resultaat terugschrijven
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add audit/juv_import
          git commit -m "import gekozen juveniele foto's $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
