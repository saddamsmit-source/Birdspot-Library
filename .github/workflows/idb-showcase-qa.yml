name: Birdspot IDB Blob & Home Showcase QA

on:
  pull_request:
    paths:
      - "src/features/home/**"
      - "src/data/sightings.js"
      - "src/utils/photoUrl.js"
      - "index.html"
      - "sw.js"
      - "tests/test_birdspot_idb.py"
      - ".github/workflows/idb-showcase-qa.yml"

jobs:
  idb-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: IDB blob regressie + Home-showcase decode/negatieve controle
        run: python tests/test_birdspot_idb.py
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idb-showcase-screenshots
          path: tests/screenshots/idb_*.png
          if-no-files-found: ignore
