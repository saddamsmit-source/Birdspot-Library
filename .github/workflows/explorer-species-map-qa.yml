name: Birdspot Explorer Species & Status Map QA
on:
  pull_request:
    paths:
      - "src/features/map/**"
      - "styles/explorer-status-map.css"
      - "src/features/sightings/**"
      - "index.html"
      - "sw.js"
      - "tests/test_explorer_species_cluster.py"
      - ".github/workflows/explorer-species-map-qa.yml"
jobs:
  map-filters:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test filtering, cluster composition and zoom UI
        run: python tests/test_explorer_species_cluster.py
      - name: Upload map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-species-status-screenshots
          path: tests/screenshots/bird_map_*.png
          if-no-files-found: ignore
