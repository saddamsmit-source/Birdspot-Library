name: Birdspot F3-R22 content QA
on:
  pull_request:
    branches:
      - qa/birdspot-f3-r21-media-graspieper-ijsvogel-fuut-20261119
  workflow_dispatch:
concurrency:
  group: birdspot-f3-r22-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  content-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source, evidence and species regressions
        run: |
          node tests/test_lookalike_r22.mjs
          node tests/test_lookalike_r21.mjs
          node tests/test_lookalike_r09.mjs
          node tests/test_kennisbaseline.mjs
          node tests/test_f3_140_unified_rebaseline.mjs
          node tests/test_audio_evidence_ceiling.mjs
          node tests/test_guide_poses.mjs
          python3 -I tools/kennisbaseline/build_knowledge.py --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: python -m pip install -r tests/requirements.txt numpy==2.1.3
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Generated media remains canonical
        run: |
          python tools/species/build.py
          git diff --exit-code src/features/species/guideMedia.js src/features/species/guidePhotos.js
          python tests/test_orig_check.py
          python tests/test_kennisbaseline_validator.py
      - name: Real mobile comparisons, navigation, zoom and audio
        run: python tests/test_lookalike_r22_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: birdspot-f3-r22-browser
          path: tests/screenshots/lookalike_r22/*.png
